name: Build Windows (ClevVPN)

# Собирает Windows-установщик ClevVPN на облачном Windows-раннере GitHub.
# Запуск: вкладка Actions → Build Windows → Run workflow (или на каждый push).
# Результат: установщик .exe в артефактах запуска (Artifacts).

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths: [ 'windows/**', '.github/workflows/windows.yml' ]

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows/src-tauri
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows/src-tauri

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^1" --locked

      - name: Download sing-box.exe into bin/
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          $rel = Invoke-RestMethod "https://api.github.com/repos/SagerNet/sing-box/releases/latest"
          $asset = $rel.assets | Where-Object { $_.name -match 'windows-amd64\.zip$' } | Select-Object -First 1
          Write-Host "sing-box: $($asset.name)"
          Invoke-WebRequest $asset.browser_download_url -OutFile sb.zip
          Expand-Archive sb.zip -DestinationPath sbtmp -Force
          $exe = Get-ChildItem sbtmp -Recurse -Filter sing-box.exe | Select-Object -First 1
          Copy-Item $exe.FullName bin/sing-box.exe -Force

      - name: Generate app icon
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $bmp = New-Object System.Drawing.Bitmap 512,512
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.Clear([System.Drawing.Color]::FromArgb(11,11,13))
          $brush = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(255,196,0))
          $g.FillEllipse($brush, 128,128,256,256)
          $bmp.Save("icon-src.png", [System.Drawing.Imaging.ImageFormat]::Png)
          cargo tauri icon icon-src.png

      - name: Build installer
        run: cargo tauri build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ClevVPN-Windows-Setup
          path: |
            windows/src-tauri/target/release/bundle/nsis/*.exe
            windows/src-tauri/target/release/clevvpn.exe
          if-no-files-found: warn
